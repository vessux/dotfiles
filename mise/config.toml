# Global mise toolchain — stowed to ~/.config/mise/config.toml on Mac + devbox.
# Provides ambient runtimes outside any project; a repo's own .mise.toml still wins.
# On the Mac these shadow the nix-installed copies via PATH precedence (mise activate
# prepends its shims). node/just stay declared in nix/packages.nix for now — remove
# them once mise is verified on both boxes (the "move off nix" follow-up). uv is
# here too — it's the Python project manager (per-repo venv + uv.lock); mise just
# ships the binary, each project owns its deps (see e.g. homelab's pyproject.toml).
[tools]
# LTS line, matches the Mac's nix node 24.x. Ships npm, which is what `npm link`
# (umbel — needs node >=18.17) was missing on devbox.
node = "24"
just = "latest"
uv = "latest"
# plannotator — annotation UI binary; replaces the hand-rolled installer
# claude-code/scripts/update-plannotator.sh. The github: backend (ubi: is
# deprecated, gone in mise 2027.1.0) auto-detects the per-OS/arch release asset,
# verifies GitHub build-provenance attestations, and records the sha256 in the
# lockfile. macOS-only (`os`): it's a Bun-compiled binary requiring AVX2, which
# the devbox host CPU (i5-3570K, Ivy Bridge) lacks → SIGILL on launch. Pinned
# (was 0.19.24); bump explicitly here or via `mise up github:backnotprop/plannotator`.
"github:backnotprop/plannotator" = { version = "0.19.27", os = ["macos"] }
