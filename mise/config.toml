# Global mise toolchain — stowed to ~/.config/mise/config.toml on Mac + devbox.
# Provides ambient runtimes outside any project; a repo's own .mise.toml still wins.
# On the Mac these shadow the nix-installed copies via PATH precedence (mise activate
# prepends its shims). node/just stay declared in nix/packages.nix for now — remove
# them once mise is verified on both boxes (the "move off nix" follow-up). uv is
# here too — it's the Python project manager (per-repo venv + uv.lock); mise just
# ships the binary, each project owns its deps (see e.g. homelab's pyproject.toml).
[tools]
# LTS line, matches the Mac's nix node 24.x. Ships npm, which is what `npm link`
# (umbel — needs node >=18.17) was missing on devbox.
node = "24"
just = "latest"
uv = "latest"
# plannotator — annotation UI binary; replaces the hand-rolled installer
# claude-code/scripts/update-plannotator.sh. The github: backend (ubi: is
# deprecated, gone in mise 2027.1.0) auto-detects the per-OS/arch release asset,
# verifies GitHub build-provenance attestations, and records the sha256 in the
# lockfile. macOS-only (`os`): it's a Bun-compiled binary requiring AVX2, which
# the devbox host CPU (i5-3570K, Ivy Bridge) lacks → SIGILL on launch. Pinned
# (was 0.19.24); bump explicitly here or via `mise up github:backnotprop/plannotator`.
"github:backnotprop/plannotator" = { version = "0.19.27", os = ["macos"] }

# markitdown — local rich files (PDF/docx/pptx/xlsx) -> markdown, for handing
# readable sources to agents (the `md` zsh fn in zsh/.zshrc). pipx backend driven
# by uv (see [settings.pipx] below) since there's no pipx on this box. Document-
# subset extras only — [all] drags in audio-transcription + Azure Document-
# Intelligence deps none of the use cases need; add an extra here if a file type
# comes up. Stays on PyPI/mise (not nix): Microsoft-active fast-mover, same
# "nixpkgs lags" rationale as the brew formulae in nix/packages.nix. URLs do NOT
# go through markitdown — they go through Jina (r.jina.ai) in the `md` fn.
# NB: inline-bracket extras ("pipx:markitdown[pdf,...]") are silently dropped by
# mise's uvx path — it parses off the package name. Use the `extras` option instead.
"pipx:markitdown" = { version = "latest", extras = "pdf,docx,pptx,xlsx" }
actionlint = "latest"
# python — pinned because without it the mise shim shadows every `python3` with
# macOS's system 3.9.6. Phyllary is what made this visible: its launcher gates on
# >=3.11 and was exiting 4 on every invocation, so `phyllary` did nothing on the Mac
# while still *looking* healthy — an abort that returns in ~100ms reads like a
# fast success, and it silently poisoned a performance comparison against devbox
# for two rounds. 3.13 over 3.14: it's already installed on both boxes.
python = "3.13"

# bun — JS runtime/bundler. Managed here so it's available cross-box (also wanted
# for building plannotator from source on the devbox, and for openlock later).
# The github: backend keys versions by the *full release tag* (`bun-v1.3.14`), not
# bare semver — a plain "1.3.14" 404s the tag URL. macOS (arm64) autodetects its
# asset; linux-x64 is FORCED to the baseline (SSE4.2, no-AVX2) build because the
# devbox host CPU (i5-3570K, Ivy Bridge) lacks AVX2 → the default x64 bun SIGILLs.
[tools."github:oven-sh/bun"]
version = "bun-v1.3.14"

[tools."github:oven-sh/bun".platforms]
linux-x64 = { asset_pattern = "bun-linux-x64-baseline.zip" }

# Drive the pipx backend with uv (already installed) instead of requiring pipx —
# there's no pipx on this box. Enables the markitdown install above.
[settings.pipx]
uvx = true
