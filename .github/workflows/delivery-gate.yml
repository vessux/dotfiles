name: delivery-gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  delivery-gate:
    name: delivery-gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install system checks
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq

      - name: project-gate
        run: |
          head=$(git rev-parse HEAD)
          request=$(jq -cn \
            --arg branch "${GITHUB_HEAD_REF}" \
            --arg commit "$head" \
            --arg worktree "$GITHUB_WORKSPACE" \
            '{work: {id: "pull-request", title: "Pull request validation", acceptance_criteria: "Project-gate CI validation"}, delivery: {branch: $branch, starting_commit: $commit, worktree: $worktree}, submission_owner: "phyllary"}')
          printf '%s\n' "$request" | phyllary/project-gate run | tee result.json
          jq -e --arg head "$head" '.status == "passed" and .assessed_commit == $head' result.json
