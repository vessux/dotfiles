name: delivery-gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  delivery-gate:
    name: delivery-gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install system checks
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq parallel

      - name: Set up Go for pinned bd install
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install bd 1.0.4
        run: |
          go install github.com/steveyegge/beads/cmd/bd@ce242a879
          sudo install -m 0755 "$(go env GOPATH)/bin/bd" /usr/local/bin/bd
          bd --version | grep 'bd version 1.0.4'

      - name: project-gate
        run: |
          head=$(git rev-parse HEAD)
          request=$(jq -cn \
            --arg branch "${GITHUB_HEAD_REF}" \
            --arg commit "$head" \
            --arg worktree "$GITHUB_WORKSPACE" \
            '{work: {id: "pull-request", title: "Pull request validation", acceptance_criteria: "Project-gate CI validation"}, delivery: {branch: $branch, starting_commit: $commit, worktree: $worktree}, submission_owner: "clerk"}')
          printf '%s\n' "$request" | clerk/project-gate run | tee result.json
          jq -e --arg head "$head" '.status == "passed" and .assessed_commit == $head' result.json
