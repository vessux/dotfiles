# Beginner-friendly tmux configuration
# Use C-a as prefix instead of C-b (easier to reach)
# Alternative: Use M-a (Alt+a) for even easier access
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Uncomment these lines to use Alt+a as prefix instead:
# set-option -g prefix M-a
# bind-key M-a send-prefix
# unbind C-a

# For Alt key tap alone as prefix (requires terminal config):
# set-option -g prefix 'C-['
# bind-key 'C-[' send-prefix

# Reload config file easily
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Re-init zsh in every shell pane (companion to `r`, which reloads this config).
# Runs `exec zsh` per pane via the helper script — see tmux/reload-zsh.sh.
bind R run-shell "~/.config/tmux/reload-zsh.sh" \; display-message "Reloaded zsh in all shell panes"

# Enable mouse support (great for beginners)
set -g mouse on

# Let apps that probe the terminal (yazi DA1/DSR, Kitty graphics, etc.) get
# their control-sequence responses through tmux instead of being stripped.
# Required for yazi's TRT check over SSH from inside tmux.
set -g allow-passthrough on

# set-clipboard on (NOT the 'external' default): 'external' sets the outer terminal's
# clipboard only from tmux's OWN copy-mode and IGNORES OSC 52 sequences emitted by
# applications running inside tmux. 'on' makes tmux also forward an application's OSC 52
# out to the terminal you physically sit at — required for `clip`/`plannotate` (yazi's 'A'
# key) and any program copying to the system clipboard over SSH. The forwarding needs an
# Ms terminfo cap, which tmux 3.4's 'clipboard' terminal-feature already supplies for our
# client, so no terminal-overrides Ms entry is needed.
set -g set-clipboard on

# Start windows and panes at 1, not 0 (more intuitive)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Better window splitting (more intuitive keys)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Copy mode improvements (vim-like)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Don't exit copy mode after copying
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Escape clears the highlighted selection but stays in copy mode (q still exits)
bind-key -T copy-mode-vi Escape send-keys -X clear-selection

# One line per wheel tick (finer-grained scrolling)
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Faster command sequences
set -s escape-time 0

# Catppuccin color scheme
# Color definitions (Mocha — the local-Mac default)
ctp_rosewater="#f5e0dc"
ctp_flamingo="#f2cdcd"
ctp_pink="#f5c2e7"
ctp_mauve="#cba6f7"
ctp_red="#f38ba8"
ctp_maroon="#eba0ac"
ctp_peach="#fab387"
ctp_yellow="#f9e2af"
ctp_green="#a6e3a1"
ctp_teal="#94e2d5"
ctp_sky="#89dceb"
ctp_sapphire="#74c7ec"
ctp_blue="#89b4fa"
ctp_lavender="#b4befe"
ctp_text="#cdd6f4"
ctp_subtext1="#bac2de"
ctp_subtext0="#a6adc8"
ctp_overlay2="#9399b2"
ctp_overlay1="#7f849c"
ctp_overlay0="#6c7086"
ctp_surface2="#585b70"
ctp_surface1="#45475a"
ctp_surface0="#313244"
ctp_base="#1e1e2e"
ctp_mantle="#181825"
ctp_crust="#11111b"

# On remote (SSH) sessions, re-tint to the "Berry" wine canvas so a devbox tmux
# is unmistakable from the local Mac: wine bases + a hot-pink active window/pane
# (the "lead"), keeping every other Mocha accent. Parse-time %if reads
# SSH_CONNECTION from the env tmux was started in.
%if "#{!=:#{SSH_CONNECTION},}"
ctp_base="#331824"
ctp_mantle="#2a1320"
ctp_crust="#1a0d13"
ctp_surface0="#3f2230"
ctp_surface1="#4d2b3b"
ctp_surface2="#5c3548"
ctp_mauve="#ff5fa2"
ctp_text="#f7dbe6"
%endif

# Status bar configuration
set -g status-position bottom
set -g status-style "bg=$ctp_base,fg=$ctp_text"
set -g status-left ""
set -g status-right-length 100
set -g status-left-length 20

# status-right is composed from segments so the battery block can be dropped on
# hosts that have no battery (desktops, devboxes), where it would otherwise show
# an empty colored slab. The #{...} tokens are interpolated later by their TPM
# plugins (prefix-highlight, cpu, battery).
sr_prefix="#{prefix_highlight}"
sr_cpu="#[fg=$ctp_text,bg=$ctp_surface0] #{cpu_percentage} "
sr_battery="#[fg=$ctp_text,bg=$ctp_surface1] #{battery_percentage} "
sr_clock="#[fg=$ctp_crust,bg=$ctp_pink,bold] %d/%m #[fg=$ctp_crust,bg=$ctp_blue,bold] %H:%M:%S "

# Default to no battery segment (correct for desktops / devboxes).
set -g status-right "$sr_prefix$sr_cpu$sr_clock"
# On hosts that actually have a battery, splice the battery block between CPU and
# the clock. if-shell runs synchronously at config load — before TPM initialises
# the battery plugin — so #{battery_percentage} is still a literal token in
# status-right for the plugin to find and interpolate. Detection covers macOS
# (pmset) and Linux (/sys/class/power_supply).
if-shell 'pmset -g batt 2>/dev/null | grep -q InternalBattery || ls /sys/class/power_supply/BAT* >/dev/null 2>&1' \
  'set -g status-right "$sr_prefix$sr_cpu$sr_battery$sr_clock"'

# Window status format
setw -g window-status-current-format "#[fg=$ctp_crust,bg=$ctp_mauve,bold] #I:#W#F "
setw -g window-status-format "#[fg=$ctp_text,bg=$ctp_surface0] #I:#W#F "

# Activity indicators in window status
setw -g window-status-activity-style "fg=$ctp_yellow,bg=$ctp_surface0,bold"

# Pane border colors
set -g pane-border-style "fg=$ctp_surface0"
set -g pane-active-border-style "fg=$ctp_mauve"

# Message colors
set -g message-style "bg=$ctp_yellow,fg=$ctp_crust"
set -g message-command-style "bg=$ctp_yellow,fg=$ctp_crust"

# Enable true colors and improved terminal support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Activity monitoring (non-blocking - shows in status bar instead of popups)
setw -g monitor-activity on
set -g visual-activity off
set -g activity-action other

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Quick session switching
bind-key s choose-session

# Kill session shortcuts
bind-key X confirm-before -p 'Kill current session? (y/n)' kill-session
bind-key K choose-session -F '#{session_name}: #{session_windows} windows' \; kill-session -t '%%'

# Fuzzy finders (requires tmux-fzf plugin)
bind-key "F" run-shell -t popup "tmux-fzf-session"
bind-key "f" display-popup -E "tmux list-windows -a -F '#{p16:#{session_name}:#{window_index}} #{p9:pane_current_command} #{window_panes}p  #{pane_current_path}' | sed s@$HOME@~@ | fzf --reverse | cut -d' ' -f1 | xargs tmux switch-client -t"



# Clear screen and history
bind-key C-l send-keys 'C-l' \; clear-history

# Which-key command menu (plugin provides these automatically):
# prefix + Space - Show command menu
# Ctrl + Space   - Show command menu from anywhere (root table)

# ========================================================================================
# PLUGINS (TPM)
# ========================================================================================

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Essential plugins
set -g @plugin 'tmux-plugins/tmux-sensible'          # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'         # Continuous saving/restoring
set -g @plugin 'tmux-plugins/tmux-yank'              # Better copy/paste
set -g @plugin 'tmux-plugins/tmux-open'              # Open files/URLs from tmux
set -g @plugin 'tmux-plugins/tmux-copycat'           # Enhanced search

# Status bar plugins
set -g @plugin 'tmux-plugins/tmux-cpu'               # CPU usage
set -g @plugin 'tmux-plugins/tmux-battery'           # Battery status
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'  # Show when prefix is active

# Navigation plugins
set -g @plugin 'christoomey/vim-tmux-navigator'      # Seamless vim/tmux navigation
set -g @plugin 'sainnhe/tmux-fzf'                    # Fuzzy finder for sessions/windows/panes
set -g @plugin 'alexwforsythe/tmux-which-key'        # Which-key style command menu

# Plugin Configuration
# ===================

# tmux-resurrect: Save more details
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: Auto-save every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-prefix-highlight: Customize colors
set -g @prefix_highlight_fg "$ctp_crust"
set -g @prefix_highlight_bg "$ctp_yellow"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=$ctp_crust,bg=$ctp_green"

# tmux-yank: Use system clipboard
set -g @yank_selection_mouse 'clipboard'
# Stay in copy mode (keep scroll position) after copy, but clear the selection
# highlight so the yank is visibly acknowledged (copy-pipe = clear, no cancel).
set -g @yank_action 'copy-pipe'

# tmux-fzf: Fuzzy finder configuration
TMUX_FZF_LAUNCH_KEY="F"
TMUX_FZF_OPTIONS="-p -w 80% -h 80% -m"
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'



# Auto-install TPM and every declared plugin on first launch, so a freshly
# stowed host (e.g. a new devbox) gets the full status bar — CPU%, prefix
# indicator, etc. — without a manual `prefix + I`. tmux/plugins is gitignored,
# so it never ships with the dotfiles and must be fetched per host.
#
# Clone TPM itself if absent.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# Initialize TPM (keep this near the bottom). TPM only *loads* already-installed
# plugins; it does not fetch missing ones.
run '~/.config/tmux/plugins/tpm/tpm'

# Install any declared-but-missing plugins. Keyed on a representative plugin dir
# rather than on tpm, so it still fires when tpm was set up by hand (as on a
# devbox) but the plugins themselves were never installed.
if "test ! -d ~/.config/tmux/plugins/tmux-cpu" \
   "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"
